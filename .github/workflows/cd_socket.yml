name: Continuous Deployment
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: adityakarn06/edwise-ws:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from docker hub
        run: docker pull adityakarn06/edwise-ws:latest
        
      - name: Stop and remove old container
        run: |
          docker stop edwise-ws-container || true
          docker rm edwise-ws-container --force || true
          
      - name: Run docker container
        run: |
          docker run -d \
            -p 3002:3002 \
            --name edwise-ws-container \
            --restart unless-stopped \
            -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
            -e PORT=3002 \
            -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            adityakarn06/edwise-ws:latest